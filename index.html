<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List - Toch Omot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a new task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <div class="filters">
      <button data-filter="all" class="filter-btn active">All</button>
      <button data-filter="active" class="filter-btn">Active</button>
      <button data-filter="completed" class="filter-btn">Completed</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed">Clear Completed</button>
    </div>
    <p class="hint">Click to complete • Double-click to edit • Enter saves, Escape cancels</p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
